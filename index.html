 h:'π = m ÷ M (fatia das escolas sorteadas). w = 1 ÷ π (quantos cada um representa). Conte os sorteios para saber os estágios.'},
L3:{g:'ρ',t:'O Eco do Mesmo Bairro',
 s:'Você precisa de 180 opiniões e vai a 6 quarteirões de 30 casas. O 1º vizinho do quarteirão conta uma novidade. O 2º dá a mesma opinião com outras palavras. O 30º repete o que já se ouviu 29 vezes. Quanto mais parecidos os vizinhos (ρ alto), mais eco. A conta: deff = 1 + (30 − 1) × 0,05 = 2,45, e 180 ÷ 2,45 ≈ 73. Suas 180 entrevistas valem como 73 sorteadas direto da cidade. Para valer 500 de verdade, seriam 500 × 2,45 ≈ 1.225.',
 m:[['Os vizinhos de um quarteirão','elementos de um conglomerado'],['O quanto eles se parecem','ρ (correlação intraclasse)'],['O eco crescendo com o tamanho do quarteirão','M̄ − 1 na fórmula do deff'],['180 entrevistas','n'],['73 opiniões "de verdade"','n_ef = n ÷ deff'],['Pagar mais entrevistas para compensar','n × deff']],
 f:'Se os vizinhos fossem todos diferentes (ρ perto de 0), não haveria eco: deff ficaria perto de 1 e os conglomerados perderiam quase nada.',
 r:{q:'n = 240, M̄ = 21 e ρ = 0,04. Qual o deff e o tamanho efetivo?',a:'deff = 1 + 20 × 0,04 = 1,8; n_ef = 240 ÷ 1,8 = 133 (arredonda para baixo).'},
 h:'deff = 1 + (M̄ − 1)·ρ: quanto maior o grupo e mais parecidos os membros, mais eco. n_ef = n ÷ deff, PARA BAIXO.'},
L4:{g:'±',t:'O Pescador e a Rede',
 s:'Um peixe grande (μ) está parado num ponto do lago, e ninguém sabe onde. O pescador lança uma rede centrada no palpite x̄ e com raio E. A rede ou pegou o peixe ou não pegou: depois do lançamento não existe "95% de chance". Os 95% são da técnica: se ele lançar 100 redes com esse método, cerca de 95 pegam o peixe. Quer mais certeza? Usa uma rede maior (99%), que pega mais vezes, mas cobre mais lago e diz menos sobre onde o peixe está. Quer rede menor sem perder certeza? Precisa de mais informação (mais dados).',
 m:[['O peixe parado','μ (fixo, desconhecido)'],['O centro da rede','x̄'],['O raio da rede','margem de erro E'],['A rede inteira','intervalo x̄ ± E'],['95 de 100 redes pegam','nível de confiança (do método)'],['Rede maior','mais confiança, intervalo mais largo']],
 f:'Quem se mexe é a rede (o intervalo muda a cada amostra). O peixe (μ) nunca se move. É por isso que se diz "o intervalo contém μ" e nunca "μ cai no intervalo".',
 r:{q:'Passando de 95% para 99% com os mesmos dados, a rede fica maior ou menor? E para estreitá-la sem perder confiança?',a:'Maior (mais larga). Para estreitar sem perder confiança, aumente n.'},
 h:'Confiança é do MÉTODO (da técnica), não deste intervalo. Mais confiança = rede mais larga. Mais dados = rede mais estreita.'},
L5:{g:'4×',t:'Quatro Pizzas para Metade do Erro',
 s:'Uma pizzaria pesquisa 100 clientes e erra por ±4 pontos. O dono quer errar só ±2. Ele acha que dobrar para 200 resolve. Não resolve: como o erro cai com a raiz de n, para cortar pela metade ele precisa de 400. Quadruplicar a pesquisa para ganhar metade da precisão é o preço da raiz. Depois, a conta do mínimo dá 96,04 pessoas. Ele não pode pesquisar 0,04 de pessoa: sobe para 97, porque arredondar para baixo deixaria o erro maior que o combinado.',
 m:[['±4 pontos, depois ±2','margem de erro E'],['100 para 400 clientes','n quadruplica para E cair pela metade'],['Raiz no erro','E ∝ 1 ÷ √n, logo n ∝ 1 ÷ E²'],['96,04 pessoas','n = (zc·σ ÷ E)²'],['Subir para 97','arredondar para CIMA']],
 f:'A fórmula do tamanho supõe σ conhecido ou estimado antes. Sem essa estimativa, a conta fica sem ponto de partida.',
 r:{q:'σ = 15, E = 3, 95%. Qual o n mínimo e por que se arredonda para cima?',a:'n = (1,96 × 15 ÷ 3)² = 96,04 → 97. Para baixo, o erro ficaria maior que E.'},
 h:'Metade da margem = 4× os dados. n mínimo: sempre arredonda para CIMA.'},
L6:{g:'t',t:'O Juiz z e a Estagiária t',
 s:'O Juiz z conhece o desvio padrão verdadeiro σ e fala com firmeza: usa o 1,96 de sempre. Um dia ninguém sabe o σ, e entra a Estagiária t: ela só tem o s da própria amostra, e s também oscila de amostra para amostra. Como ela sabe que pode estar errando no s, pede uma margem maior (tc > zc). Com 12 casos, tc = 2,201 contra 1,96. Com 1.000 casos, o s é confiável e ela fala quase como o juiz. O "n − 1": se a média já está fixada, o último dado da lista não é livre, ele é refém dos outros.',
 m:[['Juiz z','σ conhecido, usa zc'],['Estagiária t','só tem s, usa tc'],['A margem maior da estagiária','caudas mais pesadas da t'],['Poucos casos, mais insegurança','poucos g.l. = tc maior'],['Último dado refém','graus de liberdade = n − 1'],['1.000 casos','t se aproxima de z']],
 f:'Ter n ≥ 30 NÃO promove a estagiária a juiz. Quem decide é saber ou não o σ.',
 r:{q:'n = 16, s = 4, tc = 2,131. Qual a margem de erro?',a:'E = 2,131 × 4 ÷ √16 = 2,131.'},
 h:'Só tem s? Estagiária t, com n − 1 graus de liberdade (mesmo com n ≥ 30). Tem σ? Juiz z.'},
L7:{g:'½',t:'A Moeda e a Festa dos Cinco',
 s:'Uma empresa quer saber a proporção de clientes satisfeitos e não tem palpite nenhum. A proporção p(1 − p) é maior quando p = 0,5, o ponto em que a moeda é mais imprevisível: é o pior caso e pede a maior amostra. Se ele planejar para esse pior caso, qualquer p real exigirá menos. Há um segundo cuidado: a aproximação normal é uma festa que só começa com pelo menos 5 aprovados e 5 reprovados na amostra. Com 2 aprovados em 30 pessoas, a festa nem abre.',
 m:[['Cliente satisfeito ou não','variável de duas categorias'],['Moeda justa','p̂ = q̂ = 0,5 (pior caso)'],['Pior caso = maior amostra','n = p̂q̂ (zc ÷ E)²'],['5 convidados de cada lado','n·p̂ ≥ 5 e n·q̂ ≥ 5'],['Festa que não abre','IC normal não vale']],
 f:'Se você já tem uma estimativa prévia de p, use-a: a amostra pedida será menor que a do pior caso.',
 r:{q:'Sem estimativa prévia, E = 0,03 e 95%. Qual o n mínimo?',a:'0,25 × (1,96 ÷ 0,03)² = 1.067,11 → 1.068.'},
 h:'Sem p prévio: use 0,5. Condição: n·p̂ ≥ 5 e n·q̂ ≥ 5.'},
L8:{g:'χ²',t:'A Balança da Bagunça',
 s:'Uma fábrica de parafusos não liga tanto para o diâmetro médio, e sim para a bagunça: parafusos de tamanhos muito diferentes não encaixam. Quando o enunciado grita "variação", "dispersão" ou "desvio padrão", entra a Balança da Bagunça (χ²). A bagunça é calculada com quadrados, então nunca é negativa e tem um limite embaixo (zero) mas não em cima: por isso a balança é torta (assimétrica). Em vez de um ±, ela dá dois números críticos diferentes. O MAIOR deles (R) divide e produz o limite de baixo. A balança só funciona com parafusos de distribuição normal, sem exceção.',
 m:[['Bagunça dos parafusos','variância σ²'],['Balança torta','χ² assimétrico, só valores positivos'],['Dois pesos diferentes','χ²R e χ²L'],['O maior peso divide','χ²R no limite INFERIOR'],['Só com parafusos normais','exige população normal sempre']],
 f:'Não existe margem de erro nem simetria: a estimativa s² não fica no meio do intervalo.',
 r:{q:'n = 11, s = 2, χ²R = 18,307. Qual o limite inferior de σ²?',a:'(11 − 1) × 4 ÷ 18,307 = 40 ÷ 18,307 = 2,185.'},
 h:'"Variação" → χ². O MAIOR crítico (R) fica embaixo e dá o limite INFERIOR. Sempre exige normal.'},
L9:{g:'H0 · Ha',t:'O Réu e a Promotoria',
 s:'Numa sala de tribunal, o Réu H0 diz o que se acredita até prova em contrário: "a vida útil média é de no máximo 18 anos". A Promotoria Ha tenta mostrar o contrário: "é superior a 18". Quem manda o primeiro golpe é o réu, e ele sempre tem o "=" na sua frase (≤, = ou ≥): é a única forma de saber o que calcular. A promotoria tem as desigualdades estritas (<, >, ≠). A amostra é a prova. O dedo da promotoria aponta para um lado: > aponta para a direita, < para a esquerda, ≠ para os dois.',
 m:[['O réu','H0, sempre com a igualdade'],['A promotoria','Ha: <, > ou ≠'],['A prova','a amostra'],['O dedo da promotoria','tipo do teste (cauda)'],['"Pelo menos", "no máximo"','vão para H0 (têm igualdade)'],['"Mais de", "menos de"','vão para Ha (afirmação em Ha)']],
 f:'No tribunal, a defesa ganha se a prova for fraca; aqui também: não rejeitar H0 não prova que ela é verdadeira.',
 r:{q:'"A taxa de defeitos é de no máximo 2%." Qual o par H0 e Ha?',a:'H0: p ≤ 0,02 (afirmação) e Ha: p > 0,02, teste à direita.'},
 h:'H0 tem sempre o "=" (≤, =, ≥). Ha é o complemento estrito (<, >, ≠) e aponta a cauda.'},
L10:{g:'α β',t:'O Alarme de Incêndio',
 s:'Um prédio tem um alarme. Tipo I: o alarme dispara sem fogo (você rejeitou um H0 verdadeiro); o α é a taxa de falsos alarmes que o síndico aceita. Tipo II: há fogo e o alarme dorme (você não rejeitou um H0 falso); essa é a probabilidade β. Se o síndico deixa o alarme menos sensível para evitar falsos alarmes (α menor), aumenta o fogo despercebido (β maior). Só um alarme melhor (mais dados) melhora os dois. O valor p mede o quanto o susto foi grande: p pequeno demais derruba o "foi só um susto" (p ≤ α rejeita H0).',
 m:[['Alarme dispara sem fogo','erro tipo I (probabilidade α)'],['Fogo e alarme mudo','erro tipo II (probabilidade β)'],['Sensibilidade do alarme','nível de significância α'],['Quão grande foi o susto','valor p'],['Alarme melhor','mais dados (n maior)']],
 f:'Tipo I e II dependem de qual hipótese é H0. Para decidir qual erro é mais grave, pergunte qual deles custa mais no problema (ex.: paraquedas).',
 r:{q:'p = 0,03. Qual a decisão com α = 0,05 e com α = 0,01?',a:'Com 0,05 rejeita (0,03 ≤ 0,05). Com 0,01 não rejeita.'},
 h:'p ≤ α rejeita H0 ("p baixo, H0 fora"). Tipo I = alarme falso. Tipo II = fogo sem alarme. Não rejeitar ≠ aceitar.'},
L11:{g:'z',t:'A Linha Vermelha no Chão',
 s:'Antes do julgamento, o juiz pinta no chão uma linha vermelha: o valor crítico. Para um teste à esquerda com α = 0,05 a linha fica em −1,645. Depois chega a prova: a estatística z, que conta quantos erros padrão a amostra está do que o réu alegou. O engenheiro que ganhava US$ 66.900 (contra 68.000 alegados) tem z = −0,89: o ponto não passou da linha, e a defesa se segura. Se tivesse caído em −2, passaria da linha e o réu cairia. A linha é pintada ANTES, sem olhar a prova: é o α em forma de lugar.',
 m:[['A linha vermelha','valor crítico'],['A área além da linha','região de rejeição (α)'],['A prova que chega','estatística z = (x̄ − μ) ÷ (σ/√n)'],['Passou da linha','rejeita H0'],['Ficou antes da linha','não rejeita H0']],
 f:'Passar da linha é só uma decisão sobre H0. A conclusão final deve ser escrita no contexto da afirmação (apoiar ou rejeitar).',
 r:{q:'H0: μ ≥ 500; x̄ = 490, σ = 30, n = 36. Qual o z e qual a decisão com crítico −1,645?',a:'z = (490 − 500) ÷ 5 = −2; −2 < −1,645, então rejeita H0.'},
 h:'z = (x̄ − μ) ÷ (σ/√n). Dentro da região de rejeição (passou da linha crítica) → rejeita H0.'},
L12:{g:'z t χ²',t:'O Quarteto do Tribunal',
 s:'O tribunal tem sempre o mesmo ritual de seis passos, mas quatro juízes diferentes. Para saber quem entra em cena, o oficial faz as perguntas do fluxograma, na ordem: "Querem julgar a bagunça?" Entra o χ². "É uma resposta de sim ou não?" Entra o z de proporção. "Alguém sabe o σ?" Se sim, z; se não, t. Depois ele confere as condições (normal, n ≥ 30, n·p ≥ 5). O juiz muda; o ritual (H0, Ha, α, crítico, estatística, decisão, conclusão) nunca muda.',
 m:[['O ritual','os mesmos passos em todo teste'],['Juiz χ²','teste de variância: (n − 1)s² ÷ σ²'],['Juiz z de proporção','sim ou não: (p̂ − p) ÷ √(pq/n)'],['Juiz z','média com σ conhecido'],['Juiz t','média só com s, n − 1 g.l.']],
 f:'A ordem do fluxograma importa: se o enunciado fala em variação, o χ² vem antes de qualquer pergunta sobre média.',
 r:{q:'Teste de média, n = 25, x̄ = 103, s = 10, H0: μ = 100. Qual juiz e qual o valor?',a:'t (só tem s): t = 3 ÷ (10 ÷ 5) = 1,5, com 24 g.l.'},
 h:'Mesmos passos. Troca só a estatística: z (σ conhecido), t (só s), z de proporção, χ² (variância).'}

const GLOSS={"populacao": {"t": "População", "c": "Base", "l": "L0", "al": ["população", "populações"], "s": "O grupo inteiro sobre o qual você quer concluir algo: todos os clientes, todos os parafusos produzidos.", "why": "A estatística existe porque quase nunca dá para medir todo mundo: é caro, demorado ou até impossível (testar um parafuso até quebrar destrói o parafuso). A população é a pergunta que você quer responder. A amostra é o que dá para fazer na prática.", "use": "Antes de qualquer conta, diga com palavras quem é a população. Todo resultado só vale para ela.", "ex": "Quer saber a satisfação dos 12.000 clientes de um banco: a população são os 12.000.", "err": "Concluir sobre um grupo diferente do que foi sorteado (amostrar alunos de uma escola e falar de todas as escolas do país).", "see": ["amostra", "parametro"]}, "amostra": {"t": "Amostra", "c": "Base", "l": "L0", "al": ["amostra", "amostras"], "s": "A parte da população que você realmente observa.", "why": "Sua amostra é só uma entre muitas possíveis. Outra amostra daria números um pouco diferentes. Todos os intervalos e testes servem para medir e controlar essa incerteza causada pelo sorteio.", "use": "Precisa ser sorteada (aleatória), senão não dá para calcular o tamanho da incerteza.", "ex": "400 clientes sorteados entre 12.000.", "err": "Achar que uma amostra grande escolhida a dedo é boa. O sorteio importa mais que o tamanho.", "see": ["populacao", "estatistica", "aas"]}, "parametro": {"t": "Parâmetro", "c": "Base", "l": "L0", "al": ["parâmetro", "parâmetros"], "s": "Um número que descreve a **população inteira**: a média μ, o desvio padrão σ, a proporção p. Quase sempre é desconhecido.", "why": "É o \"valor verdadeiro\" que você quer descobrir. Usa letra grega para lembrar que é o valor ideal, que ninguém chega a ver.", "use": "Intervalos e testes são sempre sobre parâmetros, nunca sobre estatísticas: você estima μ, não x̄.", "ex": "μ = tempo médio de espera de todos os clientes.", "err": "Escrever \"H0: x̄ = 50\". Hipóteses falam do parâmetro (μ), não da média da amostra.", "see": ["estatistica", "populacao"]}, "estatistica": {"t": "Estatística (número da amostra)", "c": "Base", "l": "L0", "al": ["estatística", "estatísticas"], "s": "Um número calculado com a **amostra**: x̄, s, p̂. É o que você consegue ver.", "why": "Como a amostra muda a cada sorteio, a estatística também muda. Ela funciona como um palpite para o parâmetro. O quanto ela costuma variar de amostra para amostra é o erro padrão.", "use": "Use a estatística para estimar o parâmetro (intervalo) ou para julgar uma afirmação sobre ele (teste).", "ex": "x̄ = 106 numa amostra, enquanto μ real é desconhecido.", "err": "Usar s quando o enunciado dá σ (ou o contrário). Letra grega = população, letra latina = amostra.", "see": ["parametro", "erro-padrao"]}, "media": {"t": "Média", "c": "Base", "l": "L0", "al": [], "s": "A soma dos valores dividida pela quantidade: o ponto de equilíbrio dos dados.", "why": "Resume tudo num número típico. E tem uma propriedade valiosa: a média de muitas observações varia menos que uma observação isolada, porque os valores altos e baixos se compensam. É daí que vem o erro padrão.", "use": "Use para variáveis numéricas (tempo, peso, salário).", "ex": "5, 7 e 9 têm média 7.", "err": "Esquecer que um valor extremo puxa a média.", "see": ["desvio", "erro-padrao"]}, "desvio": {"t": "Desvio padrão", "c": "Base", "l": "L0", "al": ["desvio padrão", "desvios padrão", "desvio-padrão"], "s": "O quanto os valores costumam se afastar da média. Tem a mesma unidade dos dados.", "why": "Só a média não diz se os dados são parecidos (todos perto de 50) ou espalhados (de 0 a 100). O desvio padrão mede esse espalhamento. E ele é a matéria-prima do erro padrão: dados mais espalhados dão estimativas mais incertas.", "use": "σ é o da população; s é o da amostra. Quando o enunciado diz \"σ conhecido\", isso decide entre z e t.", "ex": "Tempos de 10 e 50 min (média 30) têm desvio maior que 28 e 32 (mesma média).", "err": "Confundir desvio padrão (espalhamento dos dados) com erro padrão (espalhamento da média).", "see": ["variancia", "erro-padrao"]}, "variancia": {"t": "Variância", "c": "Base", "l": "L8", "al": ["variância", "variâncias", "σ²"], "s": "O desvio padrão elevado ao quadrado: σ² (população) ou s² (amostra).", "why": "Elevar ao quadrado impede que desvios para cima e para baixo se cancelem e dá mais peso aos afastamentos grandes. As contas de dispersão se encaixam melhor na variância, e por isso a distribuição χ² trabalha com ela.", "use": "Intervalos e testes de dispersão usam χ² com s². Se o enunciado falar em desvio padrão, eleve ao quadrado.", "ex": "σ = 0,2 mm → σ² = 0,04 mm².", "err": "Esquecer de elevar o desvio da afirmação ao quadrado (H0: σ ≤ 0,2 vira σ² ≤ 0,04).", "see": ["quiquad", "desvio"]}, "erro-padrao": {"t": "Erro padrão", "c": "Base", "l": "L0", "al": ["erro padrão", "erros padrão", "erro-padrão"], "s": "O quanto a **média de uma amostra** costuma variar de um sorteio para outro: **σ ÷ √n**.", "why": "Imagine medir sua altura 100 vezes com uma régua imprecisa. Cada medida erra um pouco para cima ou para baixo, e ao tirar a média os erros se cancelam em parte. Quanto mais medidas, mais cancelamento e mais estável a média. Os erros não se somam em linha reta, eles se compensam, e por isso o encolhimento acompanha a **raiz** de n, e não o próprio n. É por isso que 4 vezes mais dados só cortam o erro **pela metade** (√4 = 2): cada dado novo ajuda um pouco menos que o anterior. E o σ fica em cima porque dados mais espalhados dão uma média mais instável.", "use": "É a \"régua\" de tudo o que vem depois: a margem de erro é o valor crítico × erro padrão, e o z do teste é a diferença dividida pelo erro padrão. Quando σ é desconhecido, troca-se σ por s.", "ex": "σ = 12 e n = 36 → 12 ÷ 6 = 2. Com n = 144, 12 ÷ 12 = 1: quadruplicou os dados, o erro caiu pela metade.", "err": "Confundir com o desvio padrão dos dados. Desvio padrão: espalhamento dos dados. Erro padrão: espalhamento da média.", "see": ["desvio", "media", "z", "margem"]}, "z": {"t": "Escore z", "c": "Base", "l": "L0", "al": ["escore z", "valor de z", "valor z"], "s": "Quantos **erros padrão** a média da amostra está da média esperada: **z = (x̄ − μ) ÷ (σ/√n)**.", "why": "Uma diferença de 6 pontos pode ser enorme ou irrelevante, dependendo do quanto as médias costumam variar. Dividir pelo erro padrão troca a unidade: \"6 pontos\" vira \"3 erros padrão\". Aí dá para comparar com a curva normal padrão, que é a mesma para qualquer problema, não importa se é peso, tempo ou dinheiro.", "use": "Perto de 0: amostra comum. Além de uns ±2: amostra incomum. No teste, compara-se o z com o valor crítico.", "ex": "x̄ = 106, μ = 100, erro padrão 2 → z = 3: a média da amostra está 3 erros padrão acima do esperado.", "err": "Dividir só por σ e esquecer o √n. O denominador é o erro padrão.", "see": ["erro-padrao", "normal", "valor-critico"]}, "normal": {"t": "Curva normal e tabela", "c": "Base", "l": "L0", "al": ["curva normal", "distribuição normal", "normal padrão", "tabela da normal"], "s": "A curva em forma de sino, simétrica, que descreve como as médias e os erros costumam se distribuir. A tabela dá a **área à esquerda** de cada z.", "why": "Quando muitos pequenos efeitos independentes se somam, o resultado tende a esse sino (veja o Teorema central do limite). Como o sino tem formato conhecido, dá para afirmar exatamente que 95% da área fica entre −1,96 e +1,96.", "use": "Marcos para guardar: 1,645 (5% numa cauda), 1,96 (2,5% numa cauda), 2,576 (0,5% numa cauda). É simétrica: o que vale para +z vale para −z.", "ex": "Área à esquerda de 1,96 = 0,975.", "err": "Ler a tabela como a área central. Ela dá a área à esquerda.", "see": ["z", "valor-critico", "tcl"]}, "tcl": {"t": "Teorema central do limite", "c": "Base", "l": "L5", "al": ["teorema central do limite"], "s": "Com amostras grandes, a **média da amostra** tem distribuição aproximadamente normal, mesmo que os dados originais não sejam normais.", "why": "A média é uma soma (dividida por n) de muitos pequenos efeitos independentes, e somas assim tendem ao sino, qualquer que seja a forma original. É por isso que o curso pede \"população normal **ou** n ≥ 30\": com n grande o teorema socorre; com n pequeno os dados precisam ser normais desde o início.", "use": "Condição para z e t na média: população normal ou n ≥ 30. Para variância (χ²) ele **não** ajuda: a população precisa ser normal sempre.", "ex": "", "err": "Achar que n ≥ 30 dispensa a normalidade no teste de variância.", "see": ["normal", "quiquad"]}, "aas": {"t": "Amostragem aleatória simples (AAS)", "c": "Amostragem", "l": "L1", "al": ["AAS", "amostragem aleatória simples"], "s": "Todo elemento tem a mesma chance de entrar e você tem a lista completa da população.", "why": "É o padrão-ouro: com sorteio puro dá para calcular o erro com as fórmulas básicas. Quase nunca é viável, porque exige a lista de todos e visitar elementos espalhados. Por isso existem a estratificada e os conglomerados.", "use": "É a referência de comparação: o deff compara um plano com uma AAS do mesmo tamanho.", "ex": "Sortear 300 nomes diretamente de uma lista de 5.000 funcionários.", "err": "Chamar de AAS um plano que sorteia grupos.", "see": ["conglomerado", "estratificada", "deff"]}, "conglomerado": {"t": "Conglomerado", "c": "Amostragem", "l": "L1", "al": ["conglomerado", "conglomerados"], "s": "Um grupo natural de elementos (uma escola, uma agência, uma quadra) usado como unidade de sorteio.", "why": "Muitas vezes não existe lista dos elementos, só dos grupos, e visitar elementos espalhados custa caro. Sorteando grupos inteiros, a lista de elementos só é necessária dentro dos grupos sorteados e o trabalho de campo fica mais barato. O preço: elementos do mesmo grupo se parecem, então cada observação traz menos informação nova (deff > 1).", "use": "Sorteiam-se os grupos e só os sorteados entram. Funciona melhor quando os grupos são variados por dentro e parecidos entre si.", "ex": "400 escolas: sorteiam-se 10 e entrevistam-se todos os alunos delas.", "err": "Confundir com estratificada. Conglomerados: nem todos os grupos entram.", "see": ["estratificada", "upa", "deff"]}, "estratificada": {"t": "Amostragem estratificada", "c": "Amostragem", "l": "L1", "al": ["estratificada", "amostragem estratificada", "estrato", "estratos"], "s": "Divide a população em grupos (estratos) e sorteia dentro de **todos** eles.", "why": "Quando os grupos são muito diferentes entre si, uma AAS pode, por azar, sub-representar um deles. Forçando a presença de todos, essa fonte de variação desaparece e a estimativa fica mais precisa. Funciona melhor quando cada estrato é parecido por dentro.", "use": "Todos os estratos entram e o sorteio é dentro de cada um. O objetivo é precisão. Contraste: conglomerados sorteiam grupos; estratificada sorteia dentro de todos os grupos.", "ex": "4 cursos, 50 alunos sorteados em cada um.", "err": "Inverter as duas: estratificada = todos os grupos entram; conglomerados = só os sorteados.", "see": ["conglomerado", "aas"]}, "upa": {"t": "UPA e USA", "c": "Amostragem", "l": "L2", "al": ["UPA", "USA", "unidade primária de amostragem"], "s": "UPA: unidade primária de amostragem, o conglomerado sorteado no 1º estágio. USA: unidade secundária, o elemento sorteado dentro dele no 2º estágio.", "why": "São só nomes para as camadas do sorteio: primeiro sorteia-se o grupo (primário), depois o que há dentro dele (secundário). Os nomes ajudam a perguntar \"em que etapa estou?\".", "use": "Enunciado com \"escolas e depois alunos\": UPA = escola, USA = aluno.", "ex": "12 bairros e 30 domicílios por bairro: UPA = bairro, USA = domicílio.", "err": "Trocar as duas siglas.", "see": ["estagio", "conglomerado"]}, "estagio": {"t": "Estágio", "c": "Amostragem", "l": "L2", "al": ["estágio", "estágios"], "s": "Cada etapa de sorteio. **Um estágio**: sorteiam-se grupos e observam-se todos dentro deles. **Dois estágios**: sorteiam-se grupos e depois elementos dentro deles.", "why": "Observar todos os elementos de um grupo grande custa caro e repete informação (eles são parecidos). Sortear só parte deles no segundo estágio economiza e perde pouco.", "use": "Conte os sorteios do enunciado. Em dois estágios, com m grupos e k elementos por grupo, n = m × k.", "ex": "20 setores e 50 moradores em cada: dois estágios, n = 20 × 50 = 1.000.", "err": "Somar em vez de multiplicar (20 + 50 no lugar de 20 × 50).", "see": ["upa", "pi"]}, "pi": {"t": "Probabilidade de inclusão (π)", "c": "Amostragem", "l": "L2", "al": ["probabilidade de inclusão"], "s": "A chance de um elemento da população entrar na amostra. Em um estágio, **π = m ÷ M**.", "why": "Se você sorteia m dos M grupos e todos os elementos de um grupo entram juntos, a chance de um elemento entrar é a chance do grupo dele ser sorteado: m ÷ M. Saber π permite compensar o plano na hora de estimar, por meio do peso.", "use": "Conta direta: m (grupos sorteados) ÷ M (grupos existentes).", "ex": "8 de 40 agências → π = 0,20.", "err": "Usar o número de elementos (N) no lugar do número de grupos (M).", "see": ["peso", "conglomerado"]}, "peso": {"t": "Peso amostral (w)", "c": "Amostragem", "l": "L2", "al": ["peso amostral"], "s": "Quantos elementos da população cada elemento da amostra representa: **w = 1 ÷ π**.", "why": "Se cada elemento tinha 1 chance em 5 de ser escolhido (π = 0,2), ele \"fala por\" 5 elementos. Quem tinha menos chance de entrar precisa de peso maior para a amostra refletir a população.", "use": "Multiplica cada observação pelo seu peso ao estimar totais.", "ex": "π = 0,20 → w = 5.", "err": "Usar w = π em vez de w = 1 ÷ π.", "see": ["pi"]}, "deff": {"t": "Efeito do delineamento (deff)", "c": "Amostragem", "l": "L3", "al": ["deff", "efeito do delineamento"], "s": "Quantas vezes a variância do plano por conglomerados é maior que a de uma AAS do mesmo tamanho: **deff = 1 + (M̄ − 1) × ρ**.", "why": "Se os elementos de um grupo são parecidos (ρ alto) e os grupos são grandes (M̄ alto), cada elemento extra traz quase nada de novo e a variância infla. A fórmula aponta os dois culpados: o tamanho do grupo e o quanto o grupo é parecido por dentro.", "use": "Compare com 1. deff > 1 significa menos preciso que a AAS.", "ex": "M̄ = 30 e ρ = 0,05 → deff = 1 + 29 × 0,05 = 2,45.", "err": "Esquecer de subtrair 1 de M̄ na fórmula.", "see": ["rho", "nef"]}, "rho": {"t": "Correlação intraclasse (ρ)", "c": "Amostragem", "l": "L3", "al": [], "s": "Mede o quanto os elementos de um mesmo grupo se parecem entre si. Perto de 0: grupo variado por dentro. Maior: elementos parecidos.", "why": "É a medida do \"quanto cada novo elemento do mesmo grupo repete o que eu já sei\". Se todos os alunos da escola são muito parecidos, ρ é alto e o 30º aluno é quase redundante.", "use": "Entra na fórmula do deff.", "ex": "ρ = 0,05: um pouco de semelhança dentro do grupo.", "err": "", "see": ["deff"]}, "nef": {"t": "Tamanho efetivo", "c": "Amostragem", "l": "L3", "al": ["tamanho efetivo", "n_ef"], "s": "O tamanho de uma AAS que daria a mesma precisão: **n_ef = n ÷ deff**.", "why": "Traduz a perda de precisão para algo concreto: \"meus 180 entrevistados valem como 73 sorteados diretamente\".", "use": "Arredonde para baixo. Para igualar uma AAS de tamanho n, precisa de n × deff observações em conglomerados.", "ex": "n = 180, deff = 2,45 → n_ef = 73.", "err": "Multiplicar quando deveria dividir (ou o contrário).", "see": ["deff"]}, "confianca": {"t": "Nível de confiança", "c": "Intervalos", "l": "L4", "al": ["nível de confiança", "confiança"], "s": "A porcentagem de vezes que o **método** de construir o intervalo acerta o parâmetro, se repetido muitas vezes.", "why": "A confiança é uma propriedade do método, não de um intervalo específico: depois de calculado, o intervalo contém μ ou não contém. É como um atirador que acerta 95% dos tiros. Antes de atirar há 95% de chance, e depois o tiro já acertou ou errou. Mais confiança exige um intervalo mais largo, que é o preço de errar menos.", "use": "Escolhe-se a confiança (90%, 95%, 99%) e ela define o valor crítico.", "ex": "95% de confiança: de cada 100 pesquisas feitas assim, cerca de 95 intervalos pegam μ.", "err": "Dizer \"há 95% de chance de μ estar neste intervalo\".", "see": ["ic", "valor-critico"]}, "ic": {"t": "Intervalo de confiança (IC)", "c": "Intervalos", "l": "L4", "al": ["intervalo de confiança", "intervalos de confiança", "IC"], "s": "Uma faixa de valores plausíveis para o parâmetro: **estimativa ± margem de erro**.", "why": "Um número único (x̄) quase nunca acerta μ exatamente. A faixa admite a incerteza do sorteio: o tamanho dela vem do erro padrão e da confiança escolhida.", "use": "Receita: (1) escolha a distribuição pelo fluxograma, (2) ache o valor crítico, (3) calcule E, (4) monte x̄ − E < μ < x̄ + E.", "ex": "x̄ = 8,4 e E = 0,77 → 7,63 < μ < 9,17.", "err": "Interpretar como \"95% dos dados estão no intervalo\".", "see": ["confianca", "margem"]}, "margem": {"t": "Margem de erro (E)", "c": "Intervalos", "l": "L5", "al": ["margem de erro"], "s": "Metade da largura do intervalo: o quanto você aceita errar para mais ou para menos. **E = valor crítico × erro padrão**.", "why": "Une duas peças: o valor crítico diz o quão confiante você quer ser; o erro padrão diz o quão instável é sua média. O produto dos dois é o \"colchão\" de incerteza.", "use": "Três alavancas: mais confiança aumenta E; mais dados diminuem E; mais variação aumenta E.", "ex": "IC (111,7 ; 118,3) → E = (118,3 − 111,7) ÷ 2 = 3,3.", "err": "Confundir margem de erro com erro padrão.", "see": ["erro-padrao", "valor-critico", "ic"]}, "valor-critico": {"t": "Valor crítico", "c": "Intervalos", "l": "L0", "al": ["valor crítico", "valores críticos", "zc", "tc", "crítico"], "s": "O valor de z (ou t, χ²) que marca o limite: o quão longe na curva você vai para fechar o intervalo ou para cair na região de rejeição.", "why": "Ele traduz a confiança em um número da curva. Para 95%, queremos deixar 2,5% em cada cauda, e na normal isso acontece em ±1,96. Mais confiança exige ir mais longe na curva (2,576 para 99%), e por isso o intervalo fica mais largo.", "use": "No intervalo é o zc (ou tc). No teste é a linha: passou dela, rejeita H0.", "ex": "90% → 1,645; 95% → 1,96; 99% → 2,576.", "err": "Usar o crítico de uma cauda num teste bilateral (ou o contrário).", "see": ["normal", "confianca", "regiao"]}, "t": {"t": "Distribuição t de Student", "c": "Intervalos", "l": "L6", "al": ["distribuição t", "t de Student", "t-Student"], "s": "Uma curva parecida com a normal, mas com **caudas mais pesadas**, usada para a média quando só se conhece s.", "why": "Ao trocar σ (desconhecido) por s (estimado na amostra), entra uma incerteza extra: s também varia de amostra para amostra, principalmente quando a amostra é pequena. A curva t foi criada para pagar essa incerteza: caudas mais pesadas fazem o valor crítico crescer e o intervalo ficar mais largo. Com n grande, s fica confiável e a t se aproxima da z.", "use": "σ desconhecido → t com n − 1 graus de liberdade.", "ex": "n = 16, 95% → tc = 2,131, maior que o 1,96 da z.", "err": "Usar z só porque n é grande, quando o enunciado não dá σ.", "see": ["gl", "z", "estatistica"]}, "gl": {"t": "Graus de liberdade", "c": "Intervalos", "l": "L6", "al": ["graus de liberdade", "g.l."], "s": "Quantos valores da amostra ainda podem variar livremente depois de calcular x̄. Para uma média, **g.l. = n − 1**.", "why": "Para calcular s você usa x̄, que já \"gastou\" um pedaço da informação: se você conhece x̄ e n − 1 valores, o último fica determinado. Por isso conta-se n − 1. Menos graus de liberdade significam estimativa menos confiável, e a curva t fica mais pesada.", "use": "Serve para escolher a linha da tabela t ou χ².", "ex": "n = 12 → 11 g.l.", "err": "Entrar na tabela com n em vez de n − 1.", "see": ["t", "quiquad"]}, "proporcao": {"t": "Proporção", "c": "Intervalos", "l": "L7", "al": ["proporção", "p function memUpd(q,ok,conf){

}

function dueList(){const now=Date.now();return Q.filter(q=>{const m=SAVE.mem[q.id];if(m&&m.n>=3)return false;if(SAVE.wrong.includes(q.id)||SAVE.hc.includes(q.id))return true;return !!(m&&m.seen>0&&(m.n===0||now-m.last>=GAP))})}

function buildMix(){
  const due=shuffle(dueList());let pool=due.slice(0,8);
  pool=pool.concat(shuffle(freshList())).slice(0,12);
  if(pool.length<12)pool=pool.concat(shuffle(Q.filter(q=>!pool.includes(q)&&!(SAVE.mem[q.id]&&SAVE.mem[q.id].n>=3)))).slice(0,12);
  if(pool.length<12)pool=pool.concat(shuffle(Q.filter(q=>!pool.includes(q)))).slice(0,12);

  const ci=[],cs=[],mi={},mc={};
  Object.keys(GLOSS).forEach(k=>GLOSS[k].al.forEach(a=>{if(/[A-ZΑ-Ωα-ωσρχβ]/.test(a)){cs.push(a);mc[a]=k}else{ci.push(a);mi[a.toLowerCase()]=k}}));
  const build=(arr,f)=>new RegExp('(^|[^\\p{L}\\p{N}])('+arr.slice().sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\p{L}\\p{N}])',f);

function linkSeg(seg,seen,ex,st){
  const m=[];
  [[LK.ri,t=>LK.mi[t.toLowerCase()]],[LK.rc,t=>LK.mc[t]]].forEach(([re,f])=>{re.lastIndex=0;let r;while((r=re.exec(seg))){const a=r.index+r[1].length;m.push([a,a+r[2].length,f(r[2])])}});
  m.sort((x,y)=>x[0]-y[0]||(y[1]-y[0])-(x[1]-x[0]));
  let out='',pos=0;
  for(const [a,b,k] of m){
    if(a<pos||!k||k===ex||seen.has(k)||st.n>=5)continue;
    seen.add(k);st.n++;
    out+=seg.slice(pos,a)+`<button type="button" class="term" data-g="${k}">${seg.slice(a,b)}</button>`;pos=b;
  }
  return out+seg.slice(pos);
}
function lk(h,ex){
  if(!h)return h;
  const seen=new Set(),st={n:0};let skip=0,mono=false;
  return h.split(/(<[^>]*>)/).map(p=>{
    if(p[0]==='<'){
      if(/^<(button|pre|a)\b/i.test(p))skip++;
      else if(/^<\/(button|pre|a)>/i.test(p))skip=Math.max(0,skip-1);
      else if(/^<span class="mono"/.test(p))mono=true;
      else if(/^<\/span>/.test(p))mono=false;
      return p;
    }
    return(skip||mono||!p.trim())?p:linkSeg(p,seen,ex,st);
  }).join('');
}

function bell(o){

  (o.labels||[]).forEach(t=>{g+=`<text x="${X(t[0])}" y="${t[2]||B-8}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${t[1]}</text>`});

   <div class="card" id="gcard"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="tag" id="gtag"></span><span class="muted mono" style="font-size:12px" id="gn"></span></div>

  const ord=it.view?it.view.ord:shuffle(q.o.map((t,k)=>k)),hide=!it.view&&SAVE.cfg.think;
  app.innerHTML=`${hud()}<div class="card"><div class="row" style="justify-content:space-between"><span class="tag">${WORLDS[q.w].name}</span>${it.rev?'<span class="rev">revisão</span>':''}</div><p class="q">${esc(q.q)}</p>
   ${hide?`<div id="th"><div class="hook" style="margin:0 0 12px"><b>Pense primeiro.</b> Tente responder de cabeça, ou diga em voz alta, antes de ver as opções. Lembrar sem olhar é o que fixa.</div><div class="row" style="justify-content:flex-end;margin-bottom:6px"><button class="btn pen" id="rv">Já pensei, mostrar as opções</button></div></div>`:''}
   <div class="opts" id="op" ${hide?'style="display:none"':''}>${ord.map((k,n)=>`<button class="opt" data-k="${k}" data-ok="${k===q.a}"><span class="k">${'ABCD'[n]}</span><span>${esc(q.o[k])}</span></button>`).join('')}</div><div id="cf"></div><div id="fb"></div></div>`;
  $('#prev').onclick=()=>{run.i--;persist();question()};
  $('#sx').onclick=()=>{persist();home('ini')};
  if(it.view){showFb(it);return}
  it.ord=ord;
  if(hide)$('#rv').onclick=()=>{$('#th').remove();$('#op').style.display='flex';focusLater('.opt')};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b,it));
}
function choose(btn,it){
  if(!SAVE.cfg.conf)return answer(btn,it,'a');
  app.querySelectorAll('.opt').forEach(b=>b.disabled=true);btn.classList.add('sel');
  $('#cf').innerHTML=`<div class="hook"><b>Quão certo você está?</b><div class="row" style="margin-top:8px"><button class="btn ghost sm" data-c="g">Chute</button><button class="btn ghost sm" data-c="a">Acho que sim</button><button class="btn ghost sm" data-c="c">Certeza</button></div></div>`;
  $('#cf').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#cf').innerHTML='';answer(btn,it,b.dataset.c)});focusLater('#cf button');
}
function showFb(it){
  const q=it.q,ok=it.view.ok,cf=it.view.conf,sid=QSC[q.id],scn=sid&&SCENES[sid],nx=run.queue[run.i+1];
  app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.ok==='true')b.classList.add('right');if(+b.dataset.k===it.view.pick){b.classList.add('sel');if(!ok)b.classList.add('wrong')}});
  let note='';
  if(ok&&cf==='g')note='Acertou no chute. Isso ainda não conta como dominado: a pergunta volta mais adiante.';
  else if(ok&&cf==='c')note='Certeza e acertou: seu radar está calibrado neste assunto.';
  else if(!ok&&cf==='c')note='Errou com certeza. É o erro mais valioso de corrigir: leia a explicação devagar. Ele volta logo e de novo em outra sessão, porque erros confiantes costumam reaparecer.';
  else if(!ok&&cf==='g')note='Era chute. Agora você sabe o que ainda falta.';
  const last=run.i+1>=run.queue.length||(!(nx&&nx.view)&&run.hearts<=0);
  $('#fb').innerHTML=`<div class="fb ${ok?'':'bad'}"><b>${ok?'Certo.':'Não foi essa.'}</b> ${lk(esc(q.ex))}${note?`<div class="muted" style="margin-top:8px;font-size:14px">${note}</div>`:''}${(!ok&&scn)?`<div class="hook" style="margin-top:10px"><b>Lembre da cena "${esc(scn.t)}":</b> ${esc(scn.h)}</div>`:''}</div><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn pen" id="nx">${last?'Ver resultado':'Próxima'}</button></div>`;
  $('#nx').onclick=()=>{run.i++;persist();question()};
  focusLater('#nx');
}
function answer(btn,it,conf){
  const k=+btn.dataset.k,ok=k===it.q.a,q=it.q;conf=conf||'a';
  it.view={ord:it.ord,pick:k,ok,conf};
  const cal=run.cal||(run.cal={g:[0,0],a:[0,0],c:[0,0]});
  if(!it.rev){
    cal[conf][1]++;if(ok)cal[conf][0]++;SAVE.cal[conf][1]++;if(ok)SAVE.cal[conf][0]++;
    run.first++;run.by[q.w][1]++;memUpd(q,ok,conf);
    if(ok){run.firstOk++;run.by[q.w][0]++;
      if(conf==='g'){run.streak=0;run.xp+=5;run.queue.splice(Math.min(run.i+5,run.queue.length),0,{q,rev:true,view:null})}
      else{run.streak++;run.xp+=10+Math.min(run.streak,5)*2;SAVE.wrong=SAVE.wrong.filter(x=>x!==q.id)}
    }else{run.streak=0;run.hearts--;run.missed.push(q);if(!SAVE.wrong.includes(q.id))SAVE.wrong.push(q.id);
      if(conf==='c'&&!SAVE.hc.includes(q.id))SAVE.hc.push(q.id);
      run.queue.splice(Math.min(run.i+(conf==='c'?3:4),run.queue.length),0,{q,rev:true,view:null})}
  }else if(ok){run.xp+=5;SAVE.wrong=SAVE.wrong.filter(x=>x!==q.id)}
  else{run.queue.splice(Math.min(run.i+4,run.queue.length),0,{q,rev:true,view:null})}
  persist();showFb(it);
}
function finish(){
  run.done=true;SAVE.run=null;bump(run.mode==='mix'?'rev':'test');
  const acc=run.first?Math.round(run.firstOk/run.first*100):0;
  SAVE.xp+=run.xp;
  if(run.mode!=='mix'){const b=SAVE.best[run.mode];if(b==null||acc>b)SAVE.best[run.mode]=acc}
  persist();
  const over=run.hearts<=0;
  app.innerHTML=`<div class="top"><div class="brand">${over?'Fim das <b>vidas</b>':'Fase <b>concluída</b>'}</div></div><div class="stack"><div class="card">
   <div class="big mono"><span class="grade">${acc}%</span></div><p class="muted" style="margin:6px 0 0">acertos de primeira · ${run.firstOk} de ${run.first} · +${run.xp} XP</p>
   <table style="margin-top:14px"><tr><th>Fase</th><th>Acertos</th></tr>${WORLDS.map(w=>{const [a,b]=run.by[w.id]||[0,0];return b?`<tr><td>${w.name}</td><td class="mono">${a}/${b}</td></tr>`:''}).join('')}</table></div>
   ${(()=>{const cl={g:'Chute',a:'Acho que sim',c:'Certeza'},cr=run.cal||{g:[0,0],a:[0,0],c:[0,0]},rows=['g','a','c'].filter(c=>cr[c][1]);if(!rows.length||!SAVE.cfg.conf)return'';const c=cr.c;let msg='';if(c[1]>=2)msg=c[0]/c[1]>=0.8?'Seus "certeza" estão confiáveis.':'Seus "certeza" erraram demais. Desconfie quando a resposta vier fácil.';return`<div class="card"><h3 style="margin-bottom:8px">Sua confiança x resultado</h3><table><tr><th>Você disse</th><th>Acertos</th></tr>${rows.map(c=>`<tr><td>${cl[c]}</td><td class="mono">${cr[c][0]}/${cr[c][1]}</td></tr>`).join('')}</table>${msg?`<p class="muted" style="margin:10px 0 0">${msg}</p>`:''}</div>`})()}
   ${run.missed.length?`<div class="card"><h3 style="margin-bottom:8px">Para rever</h3>${run.missed.map(q=>`<div class="check" style="display:block"><b style="font-size:15px">${esc(q.q)}</b><div class="muted" style="font-size:14px;margin-top:4px">${lk(esc(q.ex))}</div></div>`).join('')}</div>`:'<div class="card">Nenhum erro de primeira. Tente o treino misto ou o chefão.</div>'}
   <div class="row"><button class="btn pen" id="again">Jogar de novo</button><button class="btn ghost" id="hm">Início</button></div></div>`;
  const m=run.mode;$('#again').onclick=()=>start(m);$('#hm').onclick=home;
}
function boss(i,pts,log){
  if(i>=BOSS.length){
    const tot=BOSS.reduce((s,b)=>s+b.pts.length,0),xp=pts*8;SAVE.xp+=xp;SAVE.boss=null;bump('boss');
    app.innerHTML=`<div class="top"><div class="brand">Chefão <b>derrotado</b></div></div><div class="stack"><div class="card"><div class="big mono"><span class="grade">${pts}/${tot}</span></div><p class="muted">pontos-chave cobertos nas suas respostas · +${xp} XP</p><p>Se algum desafio ficou com poucos pontos, refaça só ele escrevendo de novo, sem olhar o modelo.</p></div><div class="row"><button class="btn pen" id="again">Jogar de novo</button><button class="btn ghost" id="hm">Início</button></div></div>`;
    $('#again').onclick=()=>boss(0,0,[]);$('#hm').onclick=home;return;
  }
  const b=BOSS[i];
  SAVE.boss={i,pts,log};persist();
  app.innerHTML=`<div class="hud"><span class="chip">Desafio ${i+1}/${BOSS.length}</span><span class="chip">${pts} pontos-chave</span></div>${navRow(i>0)}
  <div class="card"><span class="tag">Dissertativa</span><p class="q">${esc(b.q)}</p>
   <label for="ans" class="muted" style="font-size:14px">Escreva em 2 a 4 frases. Sublinhe mentalmente a palavra de comando. Na prova, uma resposta parcial pode render pontos; em branco rende zero.</label>
   <textarea id="ans" placeholder="Sua resposta"></textarea><div class="row" style="margin-top:12px;justify-content:space-between"><button class="btn ghost sm" id="sk">Esqueleto de resposta</button><button class="btn pen" id="see">Ver modelo e me corrigir</button></div><div id="res"></div></div>`;
  $('#prev').onclick=()=>boss(i-1,pts-(log[i-1]||0),log.slice(0,-1));$('#sx').onclick=()=>home('ini');
  $('#sk').onclick=()=>{const t=$('#ans');if(!t.value.trim()){t.value='1) O que a pergunta pede (palavra de comando):\n2) Resposta direta:\n3) Detalhe, condição ou exemplo:\n4) Conclusão em uma frase:\n';t.focus()}};
  $('#see').onclick=()=>{
    const ta=$('#ans');
    if(ta.value.trim().length<20){ta.focus();ta.placeholder='Escreva ao menos uma frase antes de ver o modelo.';return}
    $('#see').disabled=true;$('#sk').disabled=true;ta.readOnly=true;
    const reveal=pred=>{
      const nt=norm(ta.value);
      $('#res').innerHTML=`<div class="model" style="margin-top:14px"><b>Modelo de resposta</b><p style="margin:6px 0 0">${lk(esc(b.m))}</p></div>
       <p style="margin:14px 0 4px"><b>Marque os pontos que a sua resposta cobriu:</b></p>${b.pts.map((p,k)=>{const g=b.kw&&b.kw[k],h=g?(g.some(a=>a.every(t=>nt.includes(t)))?'termo-chave encontrado no seu texto':'termo-chave não encontrado no seu texto'):'';return`<label class="check"><input type="checkbox" class="pt" id="p${k}"><span>${esc(p)}${h?`<br><span class="muted" style="font-size:13px">${h}</span>`:''}</span></label>`}).join('')}
       <p id="cmp" class="muted" style="margin:8px 0 0;font-size:14px"></p>
       <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn pen" id="nxt">Próximo desafio</button></div>`;
      const upd=()=>{const got=app.querySelectorAll('.pt:checked').length;$('#cmp').textContent=pred==null?'':`Você previu ${pred} e marcou ${got}.`+(pred>got?' Esperava mais do que entregou: releia o modelo.':pred<got?' Você foi mais severo do que precisava.':' Boa calibração.')};
      app.querySelectorAll('.pt').forEach(c=>c.onchange=upd);upd();
      $('#nxt').onclick=()=>{const got=app.querySelectorAll('.pt:checked').length;boss(i+1,pts+got,log.concat([got]))};
    };
    if(SAVE.cfg.conf){
      $('#res').innerHTML=`<div class="hook" style="margin-top:14px"><b>Antes de ver o modelo: quantos dos ${b.pts.length} pontos-chave você acha que cobriu?</b><div class="row" style="margin-top:8px">${Array.from({length:b.pts.length+1},(_,k)=>`<button class="btn ghost sm" data-p="${k}">${k}</button>`).join('')}</div></div>`;
      $('#res').querySelectorAll('button').forEach(x=>x.onclick=()=>reveal(+x.dataset.p));
    }else reveal(null);
  };
}
home();
</script>

<div id="boot" aria-hidden="true"><div class="ring"></div><b>Missão <span>Amostra</span></b><div class="seg"></div></div>
<script>
try{(function(){
var R=document.querySelector(".bg"),H=document.documentElement,RM=matchMedia("(prefers-reduced-motion: reduce)").matches,FINE=matchMedia("(pointer:fine)").matches;

R.style.setProperty("--mx",cx.toFixed(3));R.style.setProperty("--my",cy.toFixed(3));R.style.setProperty("--sy",cs.toFixed(1));R.style.setProperty("--fx",fx.toFixed(0)+"px");R.style.setProperty("--fy",fy.toFixed(0)+"px");
if(Math.abs(tx-cx)+Math.abs(ty-cy)+Math.abs(ts-cs)+Math.abs(tfx-fx)+Math.abs(tfy-fy)>.4)requestAnimationFrame(loop);else run=false}

if(!RM){

var r=el.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;el.style.setProperty("--spx",(px*100).toFixed(0)+"%");el.style.setProperty("--spy",(py*100).toFixed(0)+"%");
if(!el.classList.contains("card")){el.style.setProperty("--rx",((.5-py)*7).toFixed(2)+"deg");el.style.setProperty("--ry",((px-.5)*9).toFixed(2)+"deg")}}
if(!RM&&FINE)addEventListener("pointermove",function(e){if(e.pointerType!=="mouse")return;lastE=e;if(!pend){pend=true;requestAnimationFrame(tilt)}},{passive:true});
/* partículas */
function pal(){return light()?["#1556ff","#0a38b8","#00b7e6","#59d4ff","#88ff00","#ff6600"]:["#ffffff","#8fe3ff","#59d4ff","#3b7bff","#88ff00","#ff6600"]}
function burst(x,y,n,pw){if(RM)return;var P=pal(),i;for(i=0;i<n;i++){var el=document.createElement("i"),sz=5+Math.random()*(pw>1?13:9),c=P[Math.random()<.14?4+(Math.random()<.5?1:0):Math.floor(Math.random()*4)];
el.className="pa "+(Math.random()<.62?"star":"orb2");el.style.setProperty("--s",sz.toFixed(0)+"px");el.style.color=c;document.body.appendChild(el);
var a=Math.random()*Math.PI*2,d=(40+Math.random()*90)*pw,dx=Math.cos(a)*d,dy=Math.sin(a)*d-20*pw,rot=(Math.random()-.5)*540,dur=650+Math.random()*600;
var an=el.animate([{transform:"translate("+x+"px,"+y+"px) scale(.2) rotate(0)",opacity:1},{transform:"translate("+(x+dx)+"px,"+(y+dy)+"px) scale(1) rotate("+rot/2+"deg)",opacity:1,offset:.55},{transform:"translate("+(x+dx*1.15)+"px,"+(y+dy+40)+"px) scale(.1) rotate("+rot+"deg)",opacity:0}],{duration:dur,easing:"cubic-bezier(.15,.7,.3,1)",fill:"forwards"});an.onfinish=(function(n){return function(){n.remove()}})(el)}}
function confetti(){if(RM)return;var P=pal(),n=70,i,W=innerWidth,H=innerHeight;for(i=0;i<n;i++){var el=document.createElement("i"),sz=6+Math.random()*10,x=Math.random()*W,c=P[Math.floor(Math.random()*P.length)];
el.className="pa "+(Math.random()<.5?"star":"orb2");el.style.setProperty("--s",sz.toFixed(0)+"px");el.style.color=c;document.body.appendChild(el);
var dx=(Math.random()-.5)*160,rot=(Math.random()-.5)*900,dur=1500+Math.random()*1400,dl=Math.random()*400;
var an=el.animate([{transform:"translate("+x+"px,-20px) rotate(0)",opacity:1},{transform:"translate("+(x+dx)+"px,"+H*1.05+"px) rotate("+rot+"deg)",opacity:.9}],{duration:dur,delay:dl,easing:"cubic-bezier(.3,.1,.6,1)",fill:"both"});an.onfinish=(function(n){return function(){n.remove()}})(el)}}
function ripple(x,y){if(RM)return;var el=document.createElement("i");el.className="rip";el.style.left=x+"px";el.style.top=y+"px";document.body.appendChild(el);
el.animate([{transform:"scale(1)",opacity:.9},{transform:"scale(7)",opacity:0}],{duration:520,easing:"ease-out"}).onfinish=function(){el.remove()}}
function flash(col){if(RM)return;var el=document.createElement("div");el.className="flash";el.style.background="radial-gradient(ellipse at 50% 45%,transparent 45%,"+col+" 130%)";document.body.appendChild(el);el.animate([{opacity:0},{opacity:1,offset:.25},{opacity:0}],{duration:520}).onfinish=function(){el.remove()}}
function shake(el){if(RM||!el)return;el.animate([{transform:"translateX(0)"},{transform:"translateX(-9px)"},{transform:"translateX(8px)"},{transform:"translateX(-5px)"},{transform:"translateX(3px)"},{transform:"translateX(0)"}],{duration:380,easing:"ease-in-out"})}
/* som (sintetizado, desligado por padrão) */
var AC=null,SON=false;try{SON=localStorage.getItem("missao-som")==="1"}catch(e){}
function ctx(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,t0,d,type,g){var c=ctx();if(!c)return;var o=c.createOscillator(),v=c.createGain();o.type=type||"sine";o.frequency.value=f;var t=c.currentTime+t0;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g||.07,t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(c.destination);o.start(t);o.stop(t+d+.02)}
function snd(k){if(!SON)return;if(k==="click")tone(1300,0,.05,"sine",.04);else if(k==="ok"){tone(660,0,.14,"sine",.08);tone(990,.09,.22,"sine",.08);tone(1320,.18,.3,"triangle",.04)}else if(k==="bad"){tone(190,0,.22,"triangle",.09);tone(140,.1,.26,"triangle",.07)}else if(k==="done"){[523,659,784,1046].forEach(function(f,i){tone(f,i*.09,.4,"sine",.07)})}}
var sb=document.getElementById("soundBtn"),ss=sb.querySelector("span");
function paintS(){sb.classList.toggle("on",SON);sb.setAttribute("aria-pressed",SON?"true":"false");ss.textContent=SON?"Som ligado":"Som desligado"}
sb.onclick=function(){SON=!SON;try{localStorage.setItem("missao-som",SON?"1":"0")}catch(e){}paintS();if(SON){ctx();snd("ok")}};paintS();
/* cliques */
addEventListener("pointerdown",function(e){var t=e.target.closest&&e.target.closest("button,.opt,.world,.lrow,.cardx.on");if(!t||t.disabled)return;ripple(e.clientX,e.clientY);if(t.id!=="soundBtn")snd("click")},true);
/* reações às respostas e conclusões */
var last=0;
new MutationObserver(function(ms){var now=Date.now();if(now-last<250)return;for(var i=0;i<ms.length;i++){var ns=ms[i].addedNodes;for(var j=0;j<ns.length;j++){var n=ns[j];if(n.nodeType!==1)continue;
var fb=n.matches&&n.matches(".fb")?n:(n.querySelector?n.querySelector(".fb"):null);
if(fb){last=now;var bad=fb.classList.contains("bad"),card=fb.closest(".card")||fb;
if(bad){shake(card);flash("rgba(255,70,100,.32)");snd("bad");var w=document.querySelector(".opt.wrong");if(w){var r=w.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,6,.6)}}
else{var o=document.querySelector(".opt.right")||fb,r2=o.getBoundingClientRect();burst(r2.left+Math.min(r2.width/2,120),r2.top+r2.height/2,22,1);snd("ok")}return}
var t=n.querySelector?n.querySelector(".grade,.top .brand b"):null;if(t&&(t.matches(".grade")||/conclu/i.test(t.textContent))){last=now;confetti();snd("done");return}}}}).observe(document.getElementById("app"),{childList:true,subtree:true});

/* desempenho: pausa em segundo plano e modo leve automático */
document.addEventListener("visibilitychange",function(){H.classList.toggle("paused",document.hidden)});
var lowHW=(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4)||(navigator.deviceMemory&&navigator.deviceMemory<=3);

else if(!RM){var fN=0,fT=0,fL=performance.now();(function probe(now){var d=now-fL;fL=now;if(fN>5){fT+=d}fN++;if(fN<50)requestAnimationFrame(probe);else if(fT/44>26)H.classList.add("lite")})(fL)}
/* atalhos: A–D / 1–4 escolhem a alternativa */
addEventListener("keydown",function(e){if(e.ctrlKey||e.metaKey||e.altKey)return;var t=e.target,tg=t&&t.tagName;if(tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT"||(t&&t.isContentEditable))return;

})()}catch(err){}
